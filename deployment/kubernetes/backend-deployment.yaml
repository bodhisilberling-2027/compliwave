apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliwave-backend
  labels:
    app: compliwave-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliwave-backend
  template:
    metadata:
      labels:
        app: compliwave-backend
    spec:
      containers:
      - name: backend
        image: ${DOCKER_REGISTRY}/compliwave-backend:${VERSION}
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: database-url
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: aws-access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: aws-secret-access-key
        - name: AWS_S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: aws-s3-bucket
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: aws-region
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: azure-openai-api-key
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: azure-openai-endpoint
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5 