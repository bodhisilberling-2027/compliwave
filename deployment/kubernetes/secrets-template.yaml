apiVersion: v1
kind: Secret
metadata:
  name: compliwave-secrets
type: Opaque
data:
  # Base64 encoded values
  database-url: BASE64_ENCODED_DATABASE_URL
  postgres-user: BASE64_ENCODED_POSTGRES_USER
  postgres-password: BASE64_ENCODED_POSTGRES_PASSWORD
  aws-access-key-id: BASE64_ENCODED_AWS_ACCESS_KEY_ID
  aws-secret-access-key: BASE64_ENCODED_AWS_SECRET_ACCESS_KEY
  aws-s3-bucket: BASE64_ENCODED_AWS_S3_BUCKET
  aws-region: BASE64_ENCODED_AWS_REGION
  azure-openai-api-key: BASE64_ENCODED_AZURE_OPENAI_API_KEY
  azure-openai-endpoint: BASE64_ENCODED_AZURE_OPENAI_ENDPOINT 