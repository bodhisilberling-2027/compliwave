apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: compliwave-db
spec:
  serviceName: compliwave-db
  replicas: 1
  selector:
    matchLabels:
      app: compliwave-db
  template:
    metadata:
      labels:
        app: compliwave-db
    spec:
      containers:
      - name: postgres
        image: postgres:14
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliwave-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: compliwave
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi 